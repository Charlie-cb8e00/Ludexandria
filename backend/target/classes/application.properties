server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/ludexandria?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JWT (cambia en producción)
app.jwt.secret=ludexandriaSecretKeyParaJWTDebeSerLarga2026!!
app.jwt.expiration-ms=86400000

# CORS frontend Vite
app.cors.allowed-origins=http://localhost:5173

# Claves externas (NO subir a Git; usa variables de entorno)
app.igdb.client-id=${IGDB_CLIENT_ID:}
app.igdb.client-secret=${IGDB_CLIENT_SECRET:}
app.ia.api-key=${IA_API_KEY:}
app.ia.base-url=${IA_BASE_URL:https://api.openai.com/v1}

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

logging.level.com.ludexandria=INFO

spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
