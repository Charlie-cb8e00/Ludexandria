# Servidor local: API en http://localhost:8080
server.port=${SERVER_PORT:8080}

# Base de datos MySQL. Los valores tras ":" son solo para desarrollo local.
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/ludexandria?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DATABASE_USERNAME:root}
spring.datasource.password=${DATABASE_PASSWORD:root}

# Sesiones: el valor predeterminado es solo para desarrollo; configura JWT_SECRET en producción.
app.jwt.secret=${JWT_SECRET:ludexandriaSecretKeyParaJWTDebeSerLarga2026!!}
# Duración del inicio de sesión en milisegundos (86400000 = 24 horas).
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Dirección del frontend permitida para conectarse al backend.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Opcional: activa búsquedas de catálogo adicionales con IGDB/Twitch.
app.igdb.client-id=${IGDB_CLIENT_ID:}
app.igdb.client-secret=${IGDB_CLIENT_SECRET:}

# Tamaño máximo de archivos CSV importados.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Crea las tablas que falten al iniciar; no borra los datos existentes.
spring.sql.init.mode=always
